[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "botping"
version = "0.1.0"
description = "Telegram bot health monitor with admin bot"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.13,<4",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "python-dotenv>=1.0",
    "tzdata>=2024.1",
    "openpyxl>=3.1",
    "aiohttp>=3.9",
]

[project.scripts]
botping = "botping.main:run"

[tool.setuptools.packages.find]
where = ["src"]

# Include SQL schema in wheel/sdist and pip install (Docker uses pip install .)
[tool.setuptools.package-data]
"botping.db" = ["*.sql"]
